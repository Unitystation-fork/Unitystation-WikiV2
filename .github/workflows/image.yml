name: Image Docker

# Construit l'image Docker du wiki (le Dockerfile, inchangé) sur GitHub et la
# publie sur ghcr.io. Rien n'est déployé : la mise en ligne reste une commande
# lancée à la main sur le VPS (voir README, « Déploiement »).
#
# - pull_request : seulement si le Dockerfile, .dockerignore, package*.json ou
#   ce fichier changent (build.yml construit déjà le site sur chaque PR) ;
#   construit et teste l'image, sans la publier ;
# - push sur main, tag v*, lancement manuel : construit, teste, publie.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR : une nouvelle poussée annule l'ancien build. main : un groupe par commit.
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ghcr.io exige des minuscules (le dépôt s'appelle Unitystation-fork/Unitystation-WikiV2).
  IMAGE: ghcr.io/unitystation-fork/unitystation-wikiv2
  # Nom local de l'image testée avant publication.
  TEST_TAG: unitystation-wikiv2:test

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publication avec GITHUB_TOKEN ; lecture seule sur les PR de forks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = dernier main (ce que le VPS construit aujourd'hui), main, sha-<commit>,
      # vX.Y tel quel sur un tag git (pas type=semver : nos tags n'ont pas de patch).
      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      # mode=max : garde en cache la couche npm ci du stage de build (mode=min ne
      # garderait que busybox). linux/amd64 seulement : le VPS est en x86.
      - name: Build (sans publier)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test - l'image démarre et sert les 4 langues
        run: |
          set -euo pipefail
          docker run -d --rm --name wiki -p 3000:3000 "$TEST_TAG"
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:3000/ && break; sleep 1; done
          # /fr/img passe par le lien symbolique créé dans le Dockerfile.
          for p in / /fr/ /ru/ /de/ /img/Icon/favicon.ico /fr/img/Icon/favicon.ico; do
            curl -fsS -o /dev/null "http://localhost:3000$p" && echo "OK $p"
          done
          docker stop wiki

      # Reprend les couches du build précédent (cache) : pas de second build complet.
      # provenance=false : manifeste simple, lisible par tout Docker.
      - name: Publication sur ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
